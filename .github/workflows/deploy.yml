name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # refresh the data snapshot twice an hour (GitHub may delay scheduled runs)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch real Hyperschedule snapshot (same-origin fallback, Hyperschedule has no CORS)
        run: npm run snapshot
      - name: Write runtime config (optional Supabase)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const url = process.env.SUPABASE_URL || "";
            const key = process.env.SUPABASE_ANON_KEY || "";
            if (url && key) fs.writeFileSync("public/config.json", JSON.stringify({ supabaseUrl: url, supabaseAnonKey: key }, null, 2));
            console.log(url && key ? "Supabase configured" : "No Supabase vars set: snapshot-only mode");
          '
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
